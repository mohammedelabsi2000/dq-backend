# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dq-backend
    runtime: docker
    plan: free
    branch: deploy
    dockerfilePath: ./docker/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: DQ Tahfiz API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: PORT
        value: "10000"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: DB_CONNECTION
        value: mysql
      # Set to "false" after the first deploy and after changing the admin password
      - key: RUN_SEEDERS
        value: "true"
      # Values below are entered in the Render dashboard
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        sync: false
