services:
  app:
    image: dq-tahfiz-api-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: dq-tahfiz-api
    ports:
      - "${APP_PORT:-9030}:80"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      APP_NAME: "DQ Tahfiz API"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:9090
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: dq_tahfiz
      DB_USERNAME: root
      DB_PASSWORD: secret
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stack
      LOG_STACK: stderr
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  db:
    image: mysql:5.7
    container_name: dq-tahfiz-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: dq_tahfiz
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

volumes:
  vendor:
  mysqldata:


networks:
  app-network:
    driver: bridge
