name: Deploy DQ Tahfiz API

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - production
          - dev
      run_tests:
        description: 'Run tests before deploy'
        required: false
        default: true
        type: boolean

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_tests == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Start containers
        run: |
          cp .env.example .env
          sed -i 's|DB_HOST=.*|DB_HOST=db|' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=dq_tahfiz|' .env
          sed -i 's|DB_USERNAME=.*|DB_USERNAME=root|' .env
          sed -i 's|DB_PASSWORD=.*|DB_PASSWORD=secret|' .env
          APP_PORT=0 docker compose up -d --build --wait

      - name: Setup application
        run: |
          docker compose exec -T app php artisan key:generate
          docker compose exec -T app php artisan migrate --force

      - name: Run tests
        run: |
          docker compose exec -T app php artisan test

      - name: Cleanup
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always() && (needs.build-and-test.result == 'success' || needs.build-and-test.result == 'skipped')
    environment:
      name: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'dev') }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.APP_PATH }}
            git pull origin ${{ github.ref_name }}
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
